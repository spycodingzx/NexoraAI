# =============================================================================
# Docker Compose - Autonomous Business Platform Pro
# =============================================================================

services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abp-core
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./campaigns:/core/campaigns
      - ./sessions:/core/sessions
      - ./workflows:/core/workflows
      - ./task_artifacts:/core/task_artifacts
      - ./runs:/core/runs
      - ./temp_files:/core/temp_files
      - ./nv_brand_templates.json:/core/nv_brand_templates.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
